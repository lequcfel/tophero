<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zawartość z IP</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: monospace;
      padding: 20px;
    }
    pre {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h2>Zawartość z 158.180.16.167:</h2>
  <pre id="output">Ładowanie...</pre>

  <script>
    fetch('https://158.180.16.167/')
      .then(response => response.text())
      .then(data => {
        document.getElementById('output').textContent = data;
      })
      .catch(error => {
        document.getElementById('output').textContent = 'Błąd wczytywania strony: ' + error;
      });
  </script>

</body>
</html>
